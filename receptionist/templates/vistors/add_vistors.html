{%load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add|Vistors</title>
    <link rel="stylesheet" href="{%static 'add_vistors.css' %}">
</head>

<body>
    <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">
                <a href="{%url 'visitor_list' %}"> Visitor List</a>

            </div>
        </div>
    </div>



    <div class="visitor-form-container">

        <div class="form-header">
            <h2>Add Visitor</h2>
            <p>Register a new visitor.</p>
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">
                    <label>Visitor Name</label>
                    <input type="text" name="visitor_name" required>
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="text" name="mobile" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Visitor Type</label>
                    <select name="visitor_type" required>
                        <option value="">Select</option>
                        <option>Patient Relative</option>
                        <option>Patient Friend</option>
                        <option>Doctor Visitor</option>
                        <option>Medical Representative</option>
                        <option>Vendor</option>
                        <option>Delivery Person</option>
                        <option>Maintenance Staff</option>
                        <option>Government Official</option>
                        <option>Job Applicant</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Purpose</label>
                    <select name="purpose" required>
                        <option value="">Select</option>
                        <option>Meet Patient</option>
                        <option>Meet Doctor</option>
                        <option>Medical Representative</option>
                        <option>Equipment Delivery</option>
                        <option>Maintenance Work</option>
                        <option>Interview</option>
                        <option>Submit Documents</option>
                        <option>Collect Reports</option>
                        <option>Administrative Work</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Patient Name</label>
                    <input type="text" name="patient_name">
                </div>

                <div class="form-group">
                    <label>Doctor Name</label>
                    <input type="text" name="doctor_name">
                </div>

                <div class="form-group">
                    <label for="department">Department</label>

                    <select name="department" id="department" required>

                        <option value="">Select Department</option>

                        <option value="general">General</option>

                        <option value="cardiac">Cardiac</option>

                        <option value="neuro">Neuro</option>

                        <option value="orthopedic">Orthopedic</option>

                        <option value="child_care">Child Care</option>

                        <option value="women_maternity">Women & Maternity</option>

                        <option value="gastro_kidney">Gastro & Kidney</option>

                        <option value="ent_eye">ENT & Eye</option>

                        <option value="skin_allergy">Skin & Allergy</option>

                        <option value="surgery_emergency">Surgery & Emergency</option>

                    </select>
                </div>

                <div class="form-group">
                    <label>No. of Visitors</label>
                    <input type="number" name="number_of_visitors" value="1" min="1">
                </div>

                <div class="form-group">
                    <label>Check In</label>
                    <input type="time" name="check_in" required>
                </div>

                <div class="form-group">
                    <label>Check Out</label>
                    <input type="time" name="check_out">
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option>Inside</option>
                        <option>Left</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Remarks</label>
                    <textarea name="remarks" rows="4"></textarea>
                </div>

            </div>

            <button type="submit" class="btn">
                Add Visitor
            </button>

        </form>

    </div>


</body>

</html>

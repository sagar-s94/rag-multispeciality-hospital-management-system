{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{%static 'doctors/edit_dr.css' %}">
</head>
<body>
    <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">
                <a href="">Present DR.S</a>

            </div>
        </div>
    </div><br>

  
<div class="doctor-form-container">

    <div class="form-header">
        <h2>Edit Doctor</h2>
        <p>Update doctor information</p>
    </div>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <!-- Personal Information -->

        <div class="form-section">

            <h3>Personal Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text"
                           name="first_name"
                           value="{{ doctor.first_name }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text"
                           name="last_name"
                           value="{{ doctor.last_name }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select Gender</option>

                        <option value="Male"
                            {% if doctor.gender == "Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if doctor.gender == "Female" %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                            {% if doctor.gender == "Other" %}selected{% endif %}>
                            Other
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date"
                           name="date_of_birth"
                           value="{{ doctor.date_of_birth|date:'Y-m-d' }}">
                </div>

            </div>

        </div>


        <!-- Profile Image -->

        <div class="form-section">

            <h3>Profile Image</h3>

            <div class="profile-image-area">

                {% if doctor.profile_image %}
                    <img src="{{ doctor.profile_image.url }}"
                         class="current-profile"
                         alt="Doctor Profile">
                {% endif %}

                <div class="form-group">
                    <label>Change Profile Image</label>

                    <input type="file"
                           name="profile_image"
                           accept="image/*">
                </div>

            </div>

        </div>


        <!-- Professional Information -->

        <div class="form-section">

            <h3>Professional Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Specialization</label>
                    <input type="text"
                           name="specialization"
                           value="{{ doctor.specialization }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text"
                           name="department"
                           value="{{ doctor.department }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text"
                           name="qualification"
                           value="{{ doctor.qualification }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Experience</label>
                    <input type="text"
                           name="experience"
                           value="{{ doctor.experience }}">
                </div>

                <div class="form-group">
                    <label>Registration Number</label>
                    <input type="text"
                           name="registration_no"
                           value="{{ doctor.registration_no }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Joining Date</label>
                    <input type="date"
                           name="joining_date"
                           value="{{ doctor.joining_date|date:'Y-m-d' }}">
                </div>

            </div>

        </div>


        <!-- Contact Information -->

        <div class="form-section">

            <h3>Contact Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text"
                           name="phone"
                           value="{{ doctor.phone }}"
                           maxlength="10"
                           required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           value="{{ doctor.email }}"
                           required>
                </div>

                <div class="form-group full-width">
                    <label>Address</label>
                    <textarea name="address"
                              rows="3">{{ doctor.address }}</textarea>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text"
                           name="city"
                           value="{{ doctor.city }}">
                </div>

                <div class="form-group">
                    <label>State</label>
                    <input type="text"
                           name="state"
                           value="{{ doctor.state }}">
                </div>

                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text"
                           name="pincode"
                           value="{{ doctor.pincode }}"
                           maxlength="6">
                </div>

            </div>

        </div>


        <!-- Consultation Information -->

        <div class="form-section">

            <h3>Consultation Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Room Number</label>
                    <input type="text"
                           name="room_no"
                           value="{{ doctor.room_no }}">
                </div>

                <div class="form-group">
                    <label>Consultation Fee</label>
                    <input type="number"
                           name="consultation_fee"
                           value="{{ doctor.consultation_fee }}"
                           step="0.01">
                </div>

                <div class="form-group">
                    <label>Available Days</label>
                    <input type="text"
                           name="available_days"
                           value="{{ doctor.available_days }}"
                           placeholder="Mon, Tue, Wed">
                </div>

                <div class="form-group">
                    <label>Status</label>

                    <select name="status">

                        <option value="Active"
                            {% if doctor.status == "Active" %}selected{% endif %}>
                            Active
                        </option>

                        <option value="Inactive"
                            {% if doctor.status == "Inactive" %}selected{% endif %}>
                            Inactive
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time"
                           name="start_time"
                           value="{{ doctor.start_time|time:'H:i' }}">
                </div>

                <div class="form-group">
                    <label>End Time</label>
                    <input type="time"
                           name="end_time"
                           value="{{ doctor.end_time|time:'H:i' }}">
                </div>

            </div>

        </div>


        <!-- Buttons -->

        <div class="form-actions">

            <a href="{% url 'doctor_list' %}"
               class="cancel-btn">
                Cancel
            </a>

            <button type="submit"
                    class="update-btn">
                Update Doctor
            </button>

        </div>

    </form>

</div>


</body>
</html>

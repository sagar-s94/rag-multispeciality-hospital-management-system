{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General|edit|room</title>
    <link rel="stylesheet" href="{%static 'gen_ipd/edit_ipd.css' %}">
</head>
<body>
    <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">
                <a href="{%url 'general_ipd_list' %}"> IPD List</a>
            </div>
        </div>
    </div><br>

    <div class="room-container">

    <div class="room-header">
        <h2>Edit Room & Bed</h2>
        <p>Update room and bed information.</p>
    </div>

    <form method="POST" class="room-form">

        {% csrf_token %}

        <div class="form-group">
            <label>Room Number</label>

            <input
                type="text"
                name="room_number"
                value="{{ edit.room_number }}"
                required
            >
        </div>


        <div class="form-group">
            <label>Bed Number</label>

            <input
                type="text"
                name="bed_number"
                value="{{ edit.bed_number }}"
                required
            >
        </div>


        <div class="form-group">
            <label>Bed Status</label>

            <select name="status" required>

                <option value="available"
                    {% if edit.status == "available" %}selected{% endif %}>
                    Available
                </option>

                <option value="occupied"
                    {% if edit.status == "occupied" %}selected{% endif %}>
                    Occupied
                </option>

                <option value="maintenance"
                    {% if edit.status == "maintenance" %}selected{% endif %}>
                    Maintenance
                </option>

            </select>

        </div>


        <div class="form-buttons">

            <button type="submit" class="save-btn">
                Update Room & Bed
            </button>

            <a href="{% url 'room_list' %}" class="cancel-btn">
                Cancel
            </a>

        </div>

    </form>

</div>
</body>
</html>

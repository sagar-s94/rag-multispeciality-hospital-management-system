{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen|IPD|Edit</title>
    <link rel="stylesheet" href="{%static 'gen_ipd/edit_ipd.css' %}">
</head>
<body>
     <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">
                <a href="{%url 'general_ipd_list' %}"> IPD List</a>
            </div>
        </div>
    </div><br>

 
<div class="body-div-IPD">

    <form method="POST">
        {% csrf_token %}

        <!-- Patient Information -->
        <div class="form-section">

            <h2>Patient Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label for="ipd_number">IPD Number</label>
                    <input
                        type="text"
                        id="ipd_number"
                        name="ipd_number"
                        value="{{ edit.ipd_number }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        value="{{ edit.first_name }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        value="{{ edit.last_name }}"
                    >
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select id="gender" name="gender" required>

                        <option value="">Select Gender</option>

                        <option value="Male"
                            >
                            Male
                        </option>

                        <option value="Female"
                            >
                            Female
                        </option>

                        <option value="Other"
                            >
                            Other
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="date_of_birth">Date of Birth</label>

                    <input
                        type="date"
                        id="date_of_birth"
                        name="date_of_birth"
                        value="{{ edit.date_of_birth|date:'Y-m-d' }}"
                    >
                </div>


                <div class="form-group">
                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="0"
                        value="{{ edit.age }}"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="blood_group">Blood Group</label>

                    <select id="blood_group" name="blood_group">

                        <option value="">Select</option>

                        <option value="A+"
                            >
                            A+
                        </option>

                        <option value="A-"
                         >
                            A-
                        </option>

                        <option value="B+"
                            >
                            B+
                        </option>

                        <option value="B-"
                      >
                            B-
                        </option>

                        <option value="AB+"
                           >
                            AB+
                        </option>

                        <option value="AB-"
                            >
                            AB-
                        </option>

                        <option value="O+"
                            >
                            O+
                        </option>

                        <option value="O-"
                       >
                            O-
                        </option>

                    </select>
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="phone">Phone</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        value="{{ edit.phone }}"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="city">City</label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        value="{{ edit.city }}"
                    >
                </div>

            </div>


            <div class="form-group full-width">

                <label for="address">Address</label>

                <textarea
                    id="address"
                    name="address"
                    rows="3"
                    required
                >{{ edit.address }}</textarea>

            </div>

        </div>


        <!-- Admission Information -->
        <div class="form-section">

            <h2>Admission Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label for="admission_date">
                        Admission Date
                    </label>

                    <input
                        type="date"
                        id="admission_date"
                        name="admission_date"
                        value="{{ edit.admission_date|date:'Y-m-d' }}"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="admission_time">
                        Admission Time
                    </label>

                    <input
                        type="time"
                        id="admission_time"
                        name="admission_time"
                        value="{{ edit.admission_time|time:'H:i' }}"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="admission_type">
                        Admission Type
                    </label>

                    <select
                        id="admission_type"
                        name="admission_type"
                    >

                        <option value="Routine"
                            >
                            Routine
                        </option>

                        <option value="Emergency"
                            >
                            Emergency
                        </option>

                        <option value="Referral"
                           >
                            Referral
                        </option>

                    </select>
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="doctor">
                        Admitting Doctor
                    </label>

                    <input
                        type="text"
                        id="doctor"
                        name="doctor"
                        value="{{ edit.doctor }}"
                        required
                    >
                </div>


                <div class="form-group">

                    <label for="ward">Ward</label>

                    <input
                        type="text"
                        id="ward"
                        name="ward"
                        value="{{ edit.ward }}"
                        readonly
                    >

                </div>


                <div class="form-group">
                    <label for="room_no">Room No.</label>

                    <input
                        type="text"
                        id="room_no"
                        name="room_no"
                        value="{{ edit.room_no }}"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="bed_no">Bed No.</label>

                    <input
                        type="text"
                        id="bed_no"
                        name="bed_no"
                        value="{{ edit.bed_no }}"
                        required
                    >
                </div>

            </div>


            <div class="form-group full-width">

                <label for="referred_by">
                    Referred By
                </label>

                <input
                    type="text"
                    id="referred_by"
                    name="referred_by"
                    value="{{ edit.referred_by }}"
                >

            </div>

        </div>


        <!-- Medical Information -->
        <div class="form-section">

            <h2>Medical Information</h2>


            <div class="form-group full-width">

                <label for="chief_complaint">
                    Chief Complaint
                </label>

                <textarea
                    id="chief_complaint"
                    name="chief_complaint"
                    rows="3"
                    required
                >{{ edit.chief_complaint }}</textarea>

            </div>


            <div class="form-group full-width">

                <label for="symptoms">
                    Symptoms
                </label>

                <textarea
                    id="symptoms"
                    name="symptoms"
                    rows="3"
                >{{ edit.symptoms }}</textarea>

            </div>


            <div class="form-group full-width">

                <label for="diagnosis">
                    Diagnosis
                </label>

                <textarea
                    id="diagnosis"
                    name="diagnosis"
                    rows="3"
                >{{ edit.diagnosis }}</textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="patient_condition">
                        Patient Condition
                    </label>

                    <select
                        id="patient_condition"
                        name="patient_condition"
                    >

                        <option value="Stable"
                            {% if edit.patient_condition == "Stable" %}selected{% endif %}>
                            Stable
                        </option>

                        <option value="Serious"
                            {% if edit.patient_condition == "Serious" %}selected{% endif %}>
                            Serious
                        </option>

                        <option value="Critical"
                            {% if edit.patient_condition == "Critical" %}selected{% endif %}>
                            Critical
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group full-width">

                <label for="allergies">
                    Allergies
                </label>

                <textarea
                    id="allergies"
                    name="allergies"
                    rows="2"
                >{{ edit.allergies }}</textarea>

            </div>


            <div class="form-group full-width">

                <label for="medical_history">
                    Medical History
                </label>

                <textarea
                    id="medical_history"
                    name="medical_history"
                    rows="3"
                >{{ edit.medical_history }}</textarea>

            </div>


            <div class="form-group full-width">

                <label for="current_medication">
                    Current Medication
                </label>

                <textarea
                    id="current_medication"
                    name="current_medication"
                    rows="3"
                >{{ edit.current_medication }}</textarea>

            </div>

        </div>


        <!-- Emergency Contact -->
        <div class="form-section">

            <h2>Emergency Contact</h2>

            <div class="form-row">

                <div class="form-group">

                    <label for="emergency_contact_name">
                        Contact Name
                    </label>

                    <input
                        type="text"
                        id="emergency_contact_name"
                        name="emergency_contact_name"
                        value="{{ edit.emergency_contact_name }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="emergency_contact_relation">
                        Relationship
                    </label>

                    <input
                        type="text"
                        id="emergency_contact_relation"
                        name="emergency_contact_relation"
                        value="{{ edit.emergency_contact_relation }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="emergency_contact_phone">
                        Contact Phone
                    </label>

                    <input
                        type="tel"
                        id="emergency_contact_phone"
                        name="emergency_contact_phone"
                        value="{{ edit.emergency_contact_phone }}"
                        required
                    >

                </div>

            </div>

        </div>


        <!-- Billing -->
        <div class="form-section">

            <h2>Billing Information</h2>

            <div class="form-row">

                <div class="form-group">

                    <label for="payment_type">
                        Payment Type
                    </label>

                    <select
                        id="payment_type"
                        name="payment_type"
                    >

                        <option value="Cash"
                            {% if edit.payment_type == "Cash" %}selected{% endif %}>
                            Cash
                        </option>

                        <option value="Insurance"
                            {% if edit.payment_type == "Insurance" %}selected{% endif %}>
                            Insurance
                        </option>

                        <option value="Government Scheme"
                            {% if edit.payment_type == "Government Scheme" %}selected{% endif %}>
                            Government Scheme
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="insurance_company">
                        Insurance Company
                    </label>

                    <input
                        type="text"
                        id="insurance_company"
                        name="insurance_company"
                        value="{{ edit.insurance_company }}"
                    >

                </div>


                <div class="form-group">

                    <label for="policy_number">
                        Policy Number
                    </label>

                    <input
                        type="text"
                        id="policy_number"
                        name="policy_number"
                        value="{{ edit.policy_number }}"
                    >

                </div>

            </div>

        </div>


        <!-- IPD Status -->
        <div class="form-section">

            <h2>IPD Status</h2>

            <div class="form-row">

                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status"
                    >

                        <option value="Admitted"
                            {% if edit.status == "Admitted" %}selected{% endif %}>
                            Admitted
                        </option>

                        <option value="Discharged"
                            {% if edit.status == "Discharged" %}selected{% endif %}>
                            Discharged
                        </option>

                        <option value="Transferred"
                            {% if edit.status == "Transferred" %}selected{% endif %}>
                            Transferred
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="expected_discharge_date">
                        Expected Discharge Date
                    </label>

                    <input
                        type="date"
                        id="expected_discharge_date"
                        name="expected_discharge_date"
                        value="{{ edit.expected_discharge_date|date:'Y-m-d' }}"
                    >

                </div>


                <div class="form-group">

                    <label for="discharge_date">
                        Discharge Date
                    </label>

                    <input
                        type="date"
                        id="discharge_date"
                        name="discharge_date"
                        value="{{ edit.discharge_date|date:'Y-m-d' }}"
                    >

                </div>

            </div>


            <div class="form-group full-width">

                <label for="discharge_notes">
                    Discharge Notes
                </label>

                <textarea
                    id="discharge_notes"
                    name="discharge_notes"
                    rows="3"
                >{{ edit.discharge_notes }}</textarea>

            </div>

        </div>


        <!-- Buttons -->
        <div class="form-actions">

            <button type="submit">
                Update Patient
            </button>

            <a
                href="{% url 'general_ipd_view' edit.id %}"
                class="cancel-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>
</body>
</html>

{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General|support|staff</title>
    <link rel="stylesheet" href="{%static 'gen_ipd/suport_staff.css' %}">
</head>

<body>
    <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">
                <a href="{%url 'suport_staff_list' %}"> Staff List</a>
            </div>
        </div>
    </div><br>
    <div>
        <form method="POST" class="staff-form">

            {% csrf_token %}

            <div class="form-group">
                <label>Staff Name</label>
                <input type="text" name="name" placeholder="Enter staff name" required>
            </div>

            <div class="form-group">
                <label>Staff Type</label>

                <select name="staff_type" required>
                    <option value="">Select Staff Type</option>
                    <option value="ward_boy">Ward Boy</option>
                    <option value="cleaning">Cleaning Worker</option>
                    <option value="housekeeping">Housekeeping</option>
                    <option value="attendant">Attendant</option>
                    <option value="security">Security</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone</label>

                <input type="text" name="phone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label>Shift</label>

                <select name="shift" required>
                    <option value="">Select Shift</option>
                    <option value="morning">Morning</option>
                    <option value="evening">Evening</option>
                    <option value="night">Night</option>
                    <option value="rotational">Rotational</option>
                </select>
            </div>

            <div class="form-group">
                <label>Status</label>

                <select name="status">

                    <option value="active">
                        Active
                    </option>

                    <option value="on_leave">
                        On Leave
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>
            </div>

            <button type="submit" class="save-btn">
                Add Staff
            </button>

        </form>
    </div>
</body>

</html>

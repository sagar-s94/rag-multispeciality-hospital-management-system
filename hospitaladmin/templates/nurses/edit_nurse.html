{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit|Nurse</title>
    <link rel="stylesheet" href="{%static 'nurse/edit_nurse.css' %}">
</head>
<body>
    <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">
                <a href="{%url 'nurse_list' %}">Nurses List</a>

            </div>
        </div>
    </div><br>



  <div class="edit-container">

    <!-- Header -->

    <div class="form-header">

        <h2>Edit Nurse</h2>

        <p>
            Update nursing staff information.
        </p>

    </div>


    <!-- Form -->

    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}


        <!-- =========================
             PERSONAL INFORMATION
        ========================== -->

        <div class="form-section">

            <h3>Personal Information</h3>

            <div class="form-grid">


                <!-- First Name -->

                <div class="form-group">

                    <label for="first_name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        value="{{ edit.first_name }}"
                        required
                    >

                </div>


                <!-- Last Name -->

                <div class="form-group">

                    <label for="last_name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        value="{{ edit.last_name }}"
                        required
                    >

                </div>


                <!-- Gender -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male"
                            {% if edit.gender == "Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if edit.gender == "Female" %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                            {% if edit.gender == "Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>


                <!-- Date of Birth -->

                <div class="form-group">

                    <label for="date_of_birth">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="date_of_birth"
                        name="date_of_birth"
                        value="{{ edit.date_of_birth|date:'Y-m-d' }}"
                        required
                    >

                </div>


                <!-- Profile Image -->

                <div class="form-group full">

                    <label for="profile_image">
                        Profile Image
                    </label>

                    {% if edit.profile_image %}

                        <div class="current-image">

                            <img
                                src="{{ edit.profile_image.url }}"
                                alt="Current Profile"
                            >

                            <span>
                                Current Image
                            </span>

                        </div>

                    {% endif %}

                    <input
                        type="file"
                        id="profile_image"
                        name="profile_image"
                        accept="image/*"
                    >

                </div>

            </div>

        </div>


        <!-- =========================
             PROFESSIONAL INFORMATION
        ========================== -->

        <div class="form-section">

            <h3>Professional Information</h3>

            <div class="form-grid">


                <!-- Registration Number -->

                <div class="form-group">

                    <label for="registration_no">
                        Registration Number
                    </label>

                    <input
                        type="text"
                        id="registration_no"
                        name="registration_no"
                        value="{{ edit.registration_no }}"
                        required
                    >

                </div>


                <!-- Qualification -->

                <div class="form-group">

                    <label for="qualification">
                        Qualification
                    </label>

                    <select
                        id="qualification"
                        name="qualification"
                        required
                    >

                        <option value="">
                            Select Qualification
                        </option>

                        <option value="ANM"
                            {% if edit.qualification == "ANM" %}selected{% endif %}>
                            ANM
                        </option>

                        <option value="GNM"
                            {% if edit.qualification == "GNM" %}selected{% endif %}>
                            GNM
                        </option>

                        <option value="B.Sc Nursing"
                            {% if edit.qualification == "B.Sc Nursing" %}selected{% endif %}>
                            B.Sc Nursing
                        </option>

                        <option value="M.Sc Nursing"
                            {% if edit.qualification == "M.Sc Nursing" %}selected{% endif %}>
                            M.Sc Nursing
                        </option>

                    </select>

                </div>


                <!-- Specialization -->

                <div class="form-group">

                    <label for="specialization">
                        Specialization
                    </label>

                    <input
                        type="text"
                        id="specialization"
                        name="specialization"
                        value="{{ edit.specialization|default:'' }}"
                    >

                </div>


                <!-- Experience -->

                <div class="form-group">

                    <label for="experience">
                        Experience (Years)
                    </label>

                    <input
                        type="number"
                        id="experience"
                        name="experience"
                        value="{{ edit.experience }}"
                        min="0"
                    >

                </div>


                <!-- Designation -->

                <div class="form-group">

                    <label for="designation">
                        Designation
                    </label>

                    <select
                        id="designation"
                        name="designation"
                        required
                    >

                        <option value="Staff Nurse"
                            {% if edit.designation == "Staff Nurse" %}selected{% endif %}>
                            Staff Nurse
                        </option>

                        <option value="Senior Staff Nurse"
                            {% if edit.designation == "Senior Staff Nurse" %}selected{% endif %}>
                            Senior Staff Nurse
                        </option>

                        <option value="Nursing Supervisor"
                            {% if edit.designation == "Nursing Supervisor" %}selected{% endif %}>
                            Nursing Supervisor
                        </option>

                        <option value="Head Nurse"
                            {% if edit.designation == "Head Nurse" %}selected{% endif %}>
                            Head Nurse
                        </option>

                    </select>

                </div>


                <!-- Joining Date -->

                <div class="form-group">

                    <label for="joining_date">
                        Joining Date
                    </label>

                    <input
                        type="date"
                        id="joining_date"
                        name="joining_date"
                        value="{{ edit.joining_date|date:'Y-m-d' }}"
                        required
                    >

                </div>

            </div>

        </div>


        <!-- =========================
             HOSPITAL ASSIGNMENT
        ========================== -->

        <div class="form-section">

            <h3>Hospital Assignment</h3>

            <div class="form-grid">


                <!-- Department -->

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        name="department"
                        value="{{ edit.department }}"
                        required
                    >

                </div>


                <!-- Ward -->

                <div class="form-group">

                    <label for="ward">
                        Ward
                    </label>

                    <input
                        type="text"
                        id="ward"
                        name="ward"
                        value="{{ edit.ward }}"
                        required
                    >

                </div>


                <!-- Room -->

                <div class="form-group">

                    <label for="room_no">
                        Room / Station No.
                    </label>

                    <input
                        type="text"
                        id="room_no"
                        name="room_no"
                        value="{{ edit.room_no|default:'' }}"
                    >

                </div>


                <!-- Shift -->

                <div class="form-group">

                    <label for="shift">
                        Shift
                    </label>

                    <select
                        id="shift"
                        name="shift"
                        required
                    >

                        <option value="Morning"
                            {% if edit.shift == "Morning" %}selected{% endif %}>
                            Morning
                        </option>

                        <option value="Evening"
                            {% if edit.shift == "Evening" %}selected{% endif %}>
                            Evening
                        </option>

                        <option value="Night"
                            {% if edit.shift == "Night" %}selected{% endif %}>
                            Night
                        </option>

                        <option value="Rotational"
                            {% if edit.shift == "Rotational" %}selected{% endif %}>
                            Rotational
                        </option>

                    </select>

                </div>


                <!-- Start Time -->

                <div class="form-group">

                    <label for="start_time">
                        Shift Start
                    </label>

                    <input
                        type="time"
                        id="start_time"
                        name="start_time"
                        value="{{ edit.start_time|time:'H:i' }}"
                    >

                </div>


                <!-- End Time -->

                <div class="form-group">

                    <label for="end_time">
                        Shift End
                    </label>

                    <input
                        type="time"
                        id="end_time"
                        name="end_time"
                        value="{{ edit.end_time|time:'H:i' }}"
                    >

                </div>


                <!-- Employment -->

                <div class="form-group">

                    <label for="employment_type">
                        Employment Type
                    </label>

                    <select
                        id="employment_type"
                        name="employment_type"
                        required
                    >

                        <option value="Full Time"
                            {% if edit.employment_type == "Full Time" %}selected{% endif %}>
                            Full Time
                        </option>

                        <option value="Part Time"
                            {% if edit.employment_type == "Part Time" %}selected{% endif %}>
                            Part Time
                        </option>

                        <option value="Contract"
                            {% if edit.employment_type == "Contract" %}selected{% endif %}>
                            Contract
                        </option>

                    </select>

                </div>


                <!-- Status -->

                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status"
                        required
                    >

                        <option value="Active"
                            {% if edit.status == "Active" %}selected{% endif %}>
                            Active
                        </option>

                        <option value="On Leave"
                            {% if edit.status == "On Leave" %}selected{% endif %}>
                            On Leave
                        </option>

                        <option value="Inactive"
                            {% if edit.status == "Inactive" %}selected{% endif %}>
                            Inactive
                        </option>

                    </select>

                </div>

            </div>

        </div>


        

        <div class="form-section">

            <h3>Contact Information</h3>

            <div class="form-grid">


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        value="{{ edit.phone }}"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ edit.email }}"
                        required
                    >

                </div>


                <!-- Address -->

                <div class="form-group full">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                    >{{ edit.address|default:'' }}</textarea>

                </div>


                <!-- City -->

                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        value="{{ edit.city|default:'' }}"
                    >

                </div>


                <!-- State -->

                <div class="form-group">

                    <label for="state">
                        State
                    </label>

                    <input
                        type="text"
                        id="state"
                        name="state"
                        value="{{ edit.state|default:'' }}"
                    >

                </div>


                <!-- Pincode -->

                <div class="form-group">

                    <label for="pincode">
                        Pincode
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        name="pincode"
                        value="{{ edit.pincode|default:'' }}"
                    >

                </div>

            </div>

        </div>


        <!-- Buttons -->

        <div class="form-buttons">

            <button
                type="submit"
                class="update-btn"
            >
                Update Nurse
            </button>


            <a
                href="{% url 'update_nurse' %}"
                class="cancel-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>

{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload|report</title>
    <link rel="stylesheet" href="{%static 'labtechnisian/upload_report.css'%}">
</head>
<body>
     <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">

                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            </div>
        </div>
    </div><br>
    <div class="upload-container">

    <h2>🧪 Upload Lab Report</h2>

    <p>
        <strong>Request ID:</strong>
        {{ reqt_list.id }}
    </p>

    <p>
        <strong>Patient:</strong>
        {{ reqt_list.patient }}
    </p>

    <p>
        <strong>Service:</strong>
        {{ reqt_list.service }}
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Upload Report</label>

        <input
            type="file"
            name="report_file"
            accept=".pdf"
            required
        >

        <label>Remarks</label>

        <textarea
            name="report_remarks"
            placeholder="Enter report remarks..."
        ></textarea>

        <button type="submit">
            Upload Report
        </button>

    </form>

</div>
</body>
</html>

{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit|Profile</title>
    <link rel="stylesheet" href="{%static 'edit_profile.css' %}">
</head>
<body>
     <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">
               <a href="{% url 'doctor_logout' %}" >
                    Logout
                </a>

            </div>
        </div>
    </div> <br>

    <div class="edit-profile-container">

    <div class="edit-profile-header">
        <h2>✏️ Edit Profile</h2>
        <p>Update your personal and professional information.</p>
    </div>


    <form method="POST"
          enctype="multipart/form-data"
          class="edit-profile-form">

        {% csrf_token %}


        <!-- Profile Image -->

        <div class="profile-image-section">

            {% if edit.profile_image %}

                <img src="{{ edit.profile_image.url }}"
                     alt="Profile Image"
                     class="profile-preview">

            {% else %}

                <div class="profile-placeholder">
                    👨‍⚕️
                </div>

            {% endif %}


            <div class="image-upload">

                <label for="profile_image">
                    Profile Photo
                </label>

                <input
                    type="file"
                    name="profile_image"
                    id="profile_image"
                    accept="image/*"
                >

                <small>
                    JPG, PNG or JPEG
                </small>

            </div>

        </div>


        <!-- Name -->

        <div class="form-row">

            <div class="form-group">

                <label for="first_name">
                    First Name
                </label>

                <input
                    type="text"
                    name="first_name"
                    id="first_name"
                    value="{{ edit.first_name }}"
                    placeholder="Enter first name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="last_name">
                    Last Name
                </label>

                <input
                    type="text"
                    name="last_name"
                    id="last_name"
                    value="{{ edit.last_name }}"
                    placeholder="Enter last name"
                    required
                >

            </div>

        </div>


        <!-- Email & Phone -->

        <div class="form-row">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    value="{{ edit.email }}"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    name="phone"
                    id="phone"
                    value="{{ edit.phone }}"
                    placeholder="Enter phone number"
                    required
                >

            </div>

        </div>


        <!-- Department -->

        <div class="form-group">

            <label for="department">
                Department
            </label>

            <select name="department"
                    id="department">

                <option value="">
                    -- Select Department --
                </option>

                <option value="general"
                    {% if edit.department == "general" %}selected{% endif %}>
                    General
                </option>

                <option value="cardiac"
                    {% if edit.department == "cardiac" %}selected{% endif %}>
                    Cardiac
                </option>

                <option value="neuro"
                    {% if edit.department == "neuro" %}selected{% endif %}>
                    Neuro
                </option>

                <option value="orthopedic"
                    {% if edit.department == "orthopedic" %}selected{% endif %}>
                    Orthopedic
                </option>

                <option value="child_care"
                    {% if edit.department == "child_care" %}selected{% endif %}>
                    Child Care
                </option>

                <option value="women_maternity"
                    {% if edit.department == "women_maternity" %}selected{% endif %}>
                    Women & Maternity
                </option>

                <option value="gastro_kidney"
                    {% if edit.department == "gastro_kidney" %}selected{% endif %}>
                    Gastro & Kidney
                </option>

                <option value="ent_eye"
                    {% if edit.department == "ent_eye" %}selected{% endif %}>
                    ENT & Eye
                </option>

                <option value="skin_allergy"
                    {% if edit.department == "skin_allergy" %}selected{% endif %}>
                    Skin & Allergy
                </option>

                <option value="surgery_emergency"
                    {% if edit.department == "surgery_emergency" %}selected{% endif %}>
                    Surgery & Emergency
                </option>

            </select>

        </div>


        <!-- Address -->

        <div class="form-group">

            <label for="address">
                Address
            </label>

            <textarea
                name="address"
                id="address"
                rows="4"
                placeholder="Enter your address"
            >{{ edit.address }}</textarea>

        </div>


        <!-- Buttons -->

        <div class="form-actions">

            <a href="{% url 'doctor_profile' %}"
               class="cancel-btn">
                Cancel
            </a>

            <button type="submit"
                    class="save-btn">
                💾 Save Changes
            </button>

        </div>

    </form>

</div>


</body>
</html>

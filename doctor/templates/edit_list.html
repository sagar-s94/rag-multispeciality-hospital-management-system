{%load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit|list</title>
    <link rel="stylesheet" href="{%static 'edit_list.css' %}">
</head>

<body>
    <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">
                <a href="{% url 'doctor_profile' %}">👨‍⚕️ Profile</a>
                <a href="{% url 'doctor_logout' %}">
                    Logout
                </a>

            </div>
        </div>
    </div> <br>

    <div class="edit-cantainer">
        <h2>Edit Service Request</h2>

        <form method="POST">

            {% csrf_token %}

            <label>Service</label>
            <input type="text" name="service" value="{{ edit.service }}">

            <br><br>

            <label>Priority</label>
            <select name="priority">

                <option value="low" >
                    Low
                </option>

                <option value="medium" >
                    Medium
                </option>

                <option value="high" >
                    High
                </option>

            </select>

            <br><br>

            <label>Status</label>
            <select name="status">

                <option value="pending" >
                    Pending
                </option>

                <option value="confirmed" >
                    Confirmed
                </option>

                <option value="completed" >
                    Completed
                </option>

                <option value="cancelled" >
                    Cancelled
                </option>

            </select>

            <br><br>

            <button type="submit">Update Request</button>

        </form>

    </div>
</body>

</html>

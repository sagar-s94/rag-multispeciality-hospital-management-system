{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make|Request</title>
    <link rel="stylesheet" href="{% static 'make_request.css' %}">
</head>
<body>
     <div class="navbar">
        <div class="image-div">
            <img src="{%static 'images/h_logo.png' %}">
        </div>
        <div class="innerdiv-one">
            <h2>RAG </h2>
            <p>Multispeciality Hospital</p>
        </div>
        <div class="innerdiv-two">
            <div class="links">
                <a href="{%url 'request_list' %}">Rqt List</a>
               <a href="{% url 'doctor_logout' %}" >
                    Logout
                </a>

            </div>
        </div>
    </div> <br>

    <div class="request-container">

    <div class="request-header">
        <h2>🧪 Make Service Request</h2>
        <p>
            Create a test or investigation request for your patient.
        </p>
    </div>


    <form method="POST" class="request-form">

        {% csrf_token %}


        <!-- Patient -->

        <div class="form-group">

            <label for="patient">
                Select Patient
            </label>

            <select name="patient" id="patient" >

                <option value="">
                    -- Select Patient --
                </option>

                {% for patient in patients %}

                    <option value="{{ patient.id }}">
                        {{ patient.patient_name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- Service -->

        <div class="form-group">

            <label for="service">
                Select Test / Service
            </label>

            <select name="service" id="service" required>

                <option value="">
                    -- Select Service --
                </option>

                <option value="ecg">
                    ECG
                </option>

                <option value="blood_test">
                    Blood Test
                </option>

                <option value="xray">
                    X-Ray
                </option>

                <option value="ct_scan">
                    CT Scan
                </option>

                <option value="mri">
                    MRI
                </option>

                <option value="ultrasound">
                    Ultrasound
                </option>

                <option value="echo">
                    Echocardiography
                </option>

                <option value="eeg">
                    EEG
                </option>

                <option value="other">
                    Other
                </option>

            </select>

        </div>


        <!-- Priority -->

        <div class="form-group">

            <label for="priority">
                Priority
            </label>

            <select name="priority" id="priority">

                <option value="normal">
                    Normal
                </option>

                <option value="urgent">
                    Urgent
                </option>

                <option value="emergency">
                    Emergency
                </option>

            </select>

        </div>


        <!-- Instructions -->

        <div class="form-group">

            <label for="instructions">
                Doctor Instructions
            </label>

            <textarea
                name="instructions"
                id="instructions"
                rows="5"
                placeholder="Enter reason or instructions for the technician..."
            ></textarea>

        </div>


        <!-- Submit -->

        <div class="form-actions">

            <button type="submit">
                📤 Send Request
            </button>

        </div>

    </form>

</div>
</body>
</html>
